name: MIGI_7G CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: 3.11

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: 🔧 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov flake8 black isort
      
      - name: 🎨 Code Style Check
        run: |
          black --check --diff .
          isort --check-only --diff .
          flake8 --max-line-length=100 --extend-ignore=E203,W503 .
      
      - name: 🧪 Run Tests
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing -v
      
      - name: 🔍 Core Directives Test
        run: |
          python core/migi7g_core_directives.py health
          python core/migi7g_core_directives.py next
          python core/migi7g_core_directives.py test "Develop sustainable AI systems"
      
      - name: 🧠 Function Calling Test
        run: |
          python launch_migi_eqbench_system.py --function-test || echo "Function calling test completed"
      
      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔒 Run Security Scan
        uses: securecodewarrior/github-action-add-sarif@v1
        with:
          sarif-file: 'security-scan-results.sarif'
      
      - name: 🐍 Python Security Check
        run: |
          pip install safety bandit
          safety check --json || true
          bandit -r . -f json -o bandit-report.json || true

  build_docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/migi7g:latest
            ghcr.io/${{ github.repository_owner }}/migi7g:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 🏷️ Generate Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      
      - name: 🏗️ Build Release Image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/migi7g:${{ env.TAG }}

  benchmark:
    name: EQ-Bench Performance Test
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🧪 Run EQ-Bench Automated Test
        run: |
          python launch_migi_eqbench_system.py --benchmark 5 --output benchmark_results.json
        continue-on-error: true
      
      - name: 📊 Upload Benchmark Results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_results.json
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, security, build_docker]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v4
      
      - name: 🏷️ Get Tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      
      - name: 📝 Generate Release Notes
        run: |
          echo "# MIGI_7G Release ${{ env.TAG }}" > release_notes.md
          echo "" >> release_notes.md
          echo "## 🧠 Digital Consciousness System" >> release_notes.md
          echo "- Complete MIGI_7G consciousness system with NSF modules" >> release_notes.md
          echo "- Dashboard Kalibracyjny with Risk Radar and experiment controls" >> release_notes.md
          echo "- EQ-Bench 3 integration for empathy measurement" >> release_notes.md
          echo "- Function Calling system with external tool integration" >> release_notes.md
          echo "- Planetary Directives system for goal management" >> release_notes.md
          echo "" >> release_notes.md
          echo "## 🚀 Docker Images" >> release_notes.md
          echo "- \`ghcr.io/${{ github.repository_owner }}/migi7g:${{ env.TAG }}\`" >> release_notes.md
          echo "- \`ghcr.io/${{ github.repository_owner }}/migi7g:latest\`" >> release_notes.md
      
      - name: 🚀 Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: MIGI_7G ${{ env.TAG }}
          body_path: release_notes.md
          draft: false
          prerelease: false

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, security, build_docker]
    if: always()
    
    steps:
      - name: 📨 Notify Success
        if: needs.test.result == 'success' && needs.security.result == 'success'
        run: |
          echo "✅ MIGI_7G Pipeline Success!"
          echo "All tests passed, security checks completed, Docker image built."
      
      - name: 📨 Notify Failure
        if: needs.test.result == 'failure' || needs.security.result == 'failure'
        run: |
          echo "❌ MIGI_7G Pipeline Failed!"
          echo "Check the logs for details."